<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JavaScript Test</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <h1>JavaScript Test</h1>

    <div id="colorBox" class="box">
      <p id="message">Click a button to change my color!</p>
    </div>

    <div class="buttons">
      <button id="redButton">Red</button>
      <button id="greenButton">Green</button>
      <button id="purpleButton">Purple</button>
    </div>

    <section class="about">
      <h2>What changes and how</h2>
      <p><strong>The change:</strong> the box&rsquo;s background color and the text inside it.</p>
      <p><strong>The interaction:</strong> clicking the Red, Green or Purple button.</p>
    </section>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
